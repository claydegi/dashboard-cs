<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Massimo - OSSEOTOUCH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard Massimo</h1>
            <p class="report-motto">I tuoi report sempre aggiornati</p>
        </header>

        <main>
            <section class="reports-section">
                <h2>I tuoi Report</h2>
                <div id="reports-container" class="report-cards-grid">
                    <p class="loading">Caricamento...</p>
                </div>
            </section>

            <section class="reports-section">
                <h2>Fatture Clienti 2026</h2>
                <div id="fatture-container" class="fatture-list">
                    <p class="loading">Caricamento...</p>
                </div>
            </section>

            <section class="reports-section">
                <h2>Strumenti</h2>
                <div class="report-cards-grid">
                    <div class="report-card report-card-crm" onclick="window.location.href='/crm?regione=LOMBARDIA&key=' + new URLSearchParams(window.location.search).get('key')">
                        <div class="report-card-tipo">CRM</div>
                        <div class="report-card-titolo">CRM Lombardia</div>
                        <div class="report-card-data">Contatti, prodotti, storico acquisti</div>
                        <div id="crm-opp-alert-lombardia"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const AGENTE = 'massimo';
    </script>
    <script src="dashboard-agente.js"></script>
</body>
</html>
