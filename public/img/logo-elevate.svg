<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <!-- Sfondo nero -->
  <rect width="460" height="110" fill="#0a0a0a" rx="6"/>
  <!-- Linea superiore sottile -->
  <line x1="20" y1="12" x2="440" y2="12" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <!-- ELE (italic, bold, bianco) -->
  <text x="22" y="80" font-family="Arial Black, Impact, sans-serif" font-size="64" font-weight="900" font-style="italic" fill="#ffffff" letter-spacing="1">ELE</text>
  <!-- V grande (piu' alta delle altre lettere) -->
  <text x="200" y="88" font-family="Arial Black, Impact, sans-serif" font-size="88" font-weight="900" font-style="italic" fill="#ffffff">V</text>
  <!-- ATE -->
  <text x="278" y="80" font-family="Arial Black, Impact, sans-serif" font-size="64" font-weight="900" font-style="italic" fill="#ffffff" letter-spacing="1">ATE</text>
  <!-- Linea inferiore -->
  <line x1="20" y1="95" x2="440" y2="95" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
</svg>